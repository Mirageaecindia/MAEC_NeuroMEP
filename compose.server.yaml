# Company server (maec-newapp, 6 Nov 2026): a reverse proxy on the host ends TLS and forwards to
# 127.0.0.1:8085; the stack gets a fixed subnet so it never collides with the other apps there.
#   docker compose --env-file .env.docker -f compose.yaml -f compose.server.yaml up -d --build
name: maec-newapp

services:
  frontend:
    # Replaces the 80 / 443 of compose.yaml: plain HTTP, reachable from the host only.
    ports: !override
      - '127.0.0.1:8085:80'

networks:
  default:
    ipam:
      config:
        - subnet: 10.231.4.0/24
