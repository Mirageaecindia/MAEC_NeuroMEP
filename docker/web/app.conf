# NeuroMEP site: the React build and the API behind /api (included by the HTTP / HTTPS server).
root /usr/share/nginx/html;
index index.html;

# Floor plans are single-page PDFs up to 20 MB (A-02, E0602); leave room for the request.
client_max_body_size 25m;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

location /api/ {
    include /etc/neuromep/headers.conf;
    proxy_pass http://neuromep_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Cable Size runs in the browser; the longest API calls are plan uploads and saves.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Hashed build files never change: cache them for a year.
location /assets/ {
    include /etc/neuromep/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The PDF.js worker is an ES module (.mjs): browsers load it only with a JavaScript type.
location ~* \.mjs$ {
    include /etc/neuromep/headers.conf;
    types { }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Single-page app: every other path is index.html, which is never cached (new builds load).
location / {
    include /etc/neuromep/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
