# Security headers, included in every location (Nginx drops server-level add_header in a location
# that sets its own). $hsts is set by the server: empty over plain HTTP, so no header is sent.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Strict-Transport-Security $hsts always;
# The app uses no camera, microphone, location or payment (security review, WBS 1.8.2).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Content Security Policy in report-only mode first: the browser console lists anything it would
# block (PDF.js worker, engine worker, downloads) without breaking the app. Once a full session on
# the server shows no report, rename the header to Content-Security-Policy to enforce it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
